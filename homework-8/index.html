<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
    <title>homework 8</title>
</head>
<body>

    <div class="title">
        <h2 class="title-content">Flex and float training</h2>
    </div>

     <div class="separator" style="margin-top: 30px;"><p class="separator-text">Flex</p></div>

    <div class="container-1">
        <div class="content-block item-1">1</div>
        <div class="content-block item-2">2</div>
    </div>

    <div class="container-2">
        <div class="content-block item-3">3</div>
        <div class="content-block item-4">4</div>
        <div class="content-block item-5">5</div>
        <div class="content-block item-6">6</div>
    </div>

    <div class="container-3">
        <div class="content-block item-7">7</div>
        <div class="content-block item-8">8</div>
        <div class="content-block item-9">9</div>
        <div class="content-block item-10">10</div>
    </div>

    <div class="container-4">
        <div class="content-block item-11">11</div>
        <div class="group-block">
            <div class="content-block item-12">12</div>
            <div class="content-block item-13">13</div>
        </div>
    </div>

    <div class="container-5">
        <div class="content-block item-14">14</div>
        <div class="group-block">
            <div class="content-block item-15">15</div>
            <div class="content-block item-16">16</div>
        </div>
    </div>

    <div class="separator"><p class="separator-text">Float</p></div>

    <div class="main-box-1">
        <div class="box-float-1">1</div>
        <div class="box-float-2">2</div>
    </div>

    <div class="main-box-2">
        <div class="box-float-3">3</div>
            <div class="group-section">
                <div class="box-float-4">4</div>
                <div class="box-float-5">5</div>
                <div class="box-float-6">6</div>
            </div>
    </div>

    <div class="main-box-3">
        <div class="group-section" style="float: left;">
            <div class="box-float-7">7</div>
            <div class="box-float-8">8</div>
        </div>
        <div class="group-section">
            <div class="box-float-9">9</div>
            <div class="box-float-10">10</div>
        </div>
    </div>

    <div class="main-box-4">
        <div class="new-group-section">
            <div class="box-float-14">11</div>
            <div class="box-float-12">12</div>
            <div class="box-float-13">13</div>
        </div>
    </div>

    <div class="main-box-5">
        <div class="new-group-section">
            <div class="box-float-14">14</div>
            <div class="box-float-15">15</div>
            <div class="box-float-16">16</div>
        </div>
    </div>

</body>
</html>
