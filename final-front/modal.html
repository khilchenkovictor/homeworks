<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles/reset.css">
    <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>
    <div class="modal">
        <div class="modal__window">
            <div class="modal__top">
                <h3 class="modal__title">We would like to help you</h3>
                <div class="modal__close"></div>
            </div>
            <input class="modal__name" type="text" placeholder="Name">
            <textarea class="modal__message" type="text" placeholder="Message"></textarea>
            <p class="modal__answer">How to answer you?</p>
            <input class="modal__phone" type="tel" placeholder="Phone number">
            <input class="modal__email" type="email" placeholder="Email">
            <button type="submit" class="modal__submit">
                Send message  
            </button>
        </div>

    </div>
</body>
</html>
